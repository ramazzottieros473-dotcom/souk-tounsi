<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souk Tounsi</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}
header {
  background: #087f5b;
  color: white;
  padding: 25px;
  text-align: center;
}
.search {
  padding: 20px;
  text-align: center;
}
input {
  padding: 12px;
  width: 70%;
  max-width: 400px;
}
button {
  padding: 12px 20px;
  background: #087f5b;
  color: white;
  border: none;
  cursor: pointer;
}
main {
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>
<header>
  <h1>Souk Tounsi 🇹🇳</h1>
  <p>Achetez et vendez en Tunisie</p>
</header>
<div class="search">
  <input type="text" placeholder="Que recherchez-vous ?">
  <button>Rechercher</button>
</div>
<main>
  <h2>Bienvenue sur Souk Tounsi</h2>
  <p>Publiez vos annonces gratuitement.</p>
  <button>Déposer une annonce</button>
</main>
</body>
</html>
